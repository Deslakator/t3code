name: Fork CI

on:
  pull_request:
    branches: [my-product]
  push:
    branches: [my-product]
  workflow_call:
    inputs:
      build_runtime:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.sha }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      T3CODE_TELEMETRY_CHANNEL: dev
      T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Check fork formatting
        run: vp fmt --check apps/server/src/fork apps/web/src/fork apps/desktop/src/fork packages/contracts/src/fork scripts/fork .github/workflows/fork-ci.yml

      - name: Lint fork code
        run: vp lint apps/server/src/fork apps/web/src/fork apps/desktop/src/fork packages/contracts/src/fork scripts/fork

      - name: Typecheck supported packages
        run: |
          vp run --filter @t3tools/contracts typecheck
          vp run --filter t3 typecheck
          vp run --filter @t3tools/web typecheck
          vp run --filter @t3tools/desktop typecheck

      - name: Test fork features
        run: vp test run apps/server/src/fork apps/web/src/fork apps/desktop/src/fork packages/contracts/src/fork --maxWorkers=1 --no-file-parallelism

      - name: Test deployment validation
        working-directory: scripts
        run: vp test run --config ../vite.config.ts fork/deploy.test.mjs --maxWorkers=1 --no-file-parallelism

      - name: Build server and web client
        # Manual deployments build the same runtime in their next job.
        if: github.event_name != 'workflow_dispatch' || inputs.build_runtime
        run: vp run --filter t3 build
